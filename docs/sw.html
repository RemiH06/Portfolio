<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Projects</title>
    <meta name="Description" content="Catálogo de proyectos de software de Hex (Lambda Heredia).">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" type="text/css" href="./css/catalog.css">
    <link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body data-src="./json/sw.json">
    <header class="catalog-header">
        <h1>Software</h1>
        <a href="https://github.com/RemiH06/Portfolio" class="repo-link" target="_blank" rel="noopener">Portfolio en GitHub ↗</a>
        <a href="./projects.html" class="back-link" title="Volver">
            <img id="sw-image" onload="this.classList.add('loaded');" src="./img/titles/xue.png" alt="Volver a proyectos">
        </a>
    </header>

    <div class="filters">
        <input type="search" id="search" placeholder="Buscar proyecto, lenguaje, herramienta…" aria-label="Buscar">
        <select id="statusFilter" aria-label="Filtrar por status">
            <option value="">Todos los status</option>
        </select>
        <select id="langFilter" aria-label="Filtrar por lenguaje">
            <option value="">Todos los lenguajes</option>
        </select>
        <span class="count" id="count"></span>
    </div>

    <main class="catalog-grid" id="grid"></main>

    <div class="detail-overlay" id="detailOverlay">
        <div class="detail"></div>
    </div>

    <script src="./js/catalog.js"></script>
</body>
</html>
